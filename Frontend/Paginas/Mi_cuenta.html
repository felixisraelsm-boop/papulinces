<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Cuenta - Papulinces</title>
     <link rel="stylesheet" href="../css/mi_cuenta.css">
</head>
<body>
    <header>
        <nav id=\"nav-dinamico\"><a href="pagina_principal.html">Volver al Feed</a></nav>
        <h1>Mi Perfil</h1>
    </header>

    <main>
        <section id="info-perfil">
            <img src="#" alt="Avatar" width="100" id="img-avatar">
            <h2 id="display-user">Nombre de Usuario</h2>
            <p id="display-bio">Biografía de ejemplo...</p>
            <button id="btn-editar-perfil">Editar datos</button>

            <div style="margin-top: 25px; padding: 15px; border: 1px solid #43a047;; background-color:#1e1e1e; border-radius: 6px; text-align: center;">
                <button id="btn-eliminar-cuenta" style="background-color: #d93025; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">
                    Eliminar mi cuenta permanentemente
                </button>
            </div>
        </section>

        <hr>

        <section id="mis-fotos">
            <h3>Mis publicaciones</h3>
            <div id="galeria-personal">
                <p>Aquí aparecerán tus fotos.</p>
            </div>
        </section>
    </main>

    <script src="../js/main.js"></script>
</body>
</html>
