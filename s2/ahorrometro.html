<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Lista Dinámica</title>
    <link rel="stylesheet" href="ahorrometro.css">
</head>
<body>
    <div class="container">
        <h2>ahorrometro</h2>
        <div class="input-group">
            <input type="text" id="nombreInput" placeholder="¿Qué necesitas comprar?" autocomplete="off">
            <button id="agregarBtn">Anotar</button>
        </div>
        <ul id="listaNombres"></ul>
        <div class="total-container">
            <strong>Total a Pagar: </strong><span id="totalGeneral">$0.00</span>
        </div>
        
        <!-- Botón para guardar en la base de datos -->
        <button id="guardarListaBtn" style="width: 100%; margin-top: 15px; background-color: #eab308; color: #000000;">Guardar Lista</button>
        
        <!-- El botón de volver abajo, ahora bien alineado con el ancho de la tarjeta -->
        <div class="footer-retorno">
            <a href="menu.html" class="btn-volver-abajo">← Volver al Menú</a>
        </div>
    </div>

    <script src="ahorrometro.js"></script>
</body>
</html>
